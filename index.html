<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:Rubik,system-ui,sans-serif;color:#FFF6E0;-webkit-tap-highlight-color:transparent;
    background:#160935;
    background-image:
      radial-gradient(ellipse 80% 45% at 50% 0%, rgba(155,48,255,.55), transparent 70%),
      radial-gradient(ellipse 70% 40% at 50% 100%, rgba(255,46,136,.35), transparent 70%);
    background-attachment:fixed;
  }
  .page{position:relative;max-width:440px;margin:0 auto;padding:16px 20px calc(120px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:28px;z-index:1}
  .sparks{position:fixed;inset:0;pointer-events:none;z-index:0}
  .sparks svg{position:absolute;animation:twinkle 2.4s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
  .top{display:flex;justify-content:space-between;align-items:center;height:44px}
  .logo{color:#fff;font:900 20px/1 Rubik,sans-serif;letter-spacing:.02em;font-style:italic}
  .logo span{color:#FFC93C}
  .tools{display:flex;gap:6px}
  .pill{height:32px;min-width:42px;padding:0 10px;border-radius:16px;border:1.5px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:#D9CCFF;font:700 12px/1 Rubik,sans-serif;cursor:pointer}
  .pill.on{background:#FFC93C;color:#2A1200;border-color:#FFC93C}

  .hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;padding-top:8px}
  .chip{font:800 12px/1 Rubik,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#FF7CBC}
  .bigcoin{position:relative;width:168px;height:168px;perspective:600px}
  .bigcoin .face{position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#FFF6B8,#FFC93C 45%,#D97E00);border:5px solid #8A4A00;
    box-shadow:0 0 0 6px rgba(255,201,60,.18),0 0 60px rgba(255,190,40,.55),inset 0 -8px 0 rgba(0,0,0,.12);
    display:flex;flex-direction:column;align-items:center;justify-content:center;animation:flip 4s ease-in-out infinite}
  .bigcoin .face::before{content:"";position:absolute;inset:14px;border-radius:50%;border:2px dashed #B36A00}
  .bigcoin .face::after{content:"";position:absolute;left:26px;top:22px;width:46px;height:18px;border-radius:50%;background:#fff;opacity:.55;transform:rotate(-30deg)}
  .bigcoin b{font:900 56px/1 Rubik,sans-serif;font-style:italic;color:#6B3200;text-shadow:0 2px 0 rgba(255,255,255,.4)}
  .bigcoin small{font:900 16px/1 Rubik,sans-serif;color:#6B3200;letter-spacing:.12em}
  @keyframes flip{0%,70%,100%{transform:rotateY(0)}85%{transform:rotateY(360deg)}}
  .orbit{position:absolute;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF3A8,#FFC93C 45%,#E08A00);border:2px solid #A35F00;animation:float 3s ease-in-out infinite}
  .orbit.o1{left:-26px;top:20px}.orbit.o2{right:-30px;top:60px;width:16px;height:16px;animation-delay:.6s}.orbit.o3{left:-8px;bottom:-6px;width:14px;height:14px;animation-delay:1.2s}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  h1{margin:0;font:900 34px/1.05 Rubik,sans-serif;font-style:italic;text-transform:uppercase;
     background:linear-gradient(180deg,#FFFFFF 0%,#FFE9A3 55%,#FFC93C 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
     filter:drop-shadow(0 3px 0 #5B1AA8) drop-shadow(0 8px 18px rgba(155,48,255,.6))}
  .sub{margin:0;font:500 16px/1.45 Rubik,sans-serif;color:#CDBDF5;max-width:340px}

  .cta{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:68px;border-radius:20px;text-decoration:none;
    background:linear-gradient(180deg,#FFE58A 0%,#FFC93C 45%,#FF9F00 100%);color:#3A1A00;
    font:900 21px/1 Rubik,sans-serif;font-style:italic;text-transform:uppercase;
    box-shadow:0 7px 0 #B35A00,0 12px 26px rgba(255,150,0,.5),inset 0 2px 0 rgba(255,255,255,.7);animation:btnpulse 1.4s ease-in-out infinite}
  .cta:active{transform:translateY(5px);box-shadow:0 2px 0 #B35A00}
  .cta::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);animation:shine 2.4s ease-in-out infinite}
  @keyframes btnpulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.15)}}
  @keyframes shine{0%{left:-60%}60%,100%{left:120%}}

  h2{margin:0 0 14px;font:900 18px/1.2 Rubik,sans-serif;font-style:italic;text-transform:uppercase;color:#fff;text-align:center}
  .steps{display:flex;flex-direction:column;gap:10px}
  .step{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1.5px solid rgba(255,255,255,.14)}
  .step .n{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font:900 18px/1 Rubik,sans-serif;font-style:italic;color:#3A1A00;
    background:linear-gradient(180deg,#FFE58A,#FFC93C 50%,#FF9F00);box-shadow:0 3px 0 #B35A00}
  .step.final{border-color:#FFC93C;box-shadow:0 0 0 1px #FFC93C,0 0 24px rgba(255,201,60,.35);background:rgba(255,201,60,.1)}
  .step .tt{display:flex;flex-direction:column;gap:3px}
  .step .tt b{font:800 16px/1.2 Rubik,sans-serif;color:#fff}
  .step .tt span{font:500 13px/1.35 Rubik,sans-serif;color:#CDBDF5}

  .games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .game{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 12px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1.5px solid rgba(255,255,255,.14);text-align:center}
  .game .ic{width:64px;height:64px;border-radius:16px;background:linear-gradient(180deg,#FFF9EA,#FFEFC7);border:3px solid #120430;display:flex;align-items:center;justify-content:center}
  .game .ic svg{width:48px;height:48px}
  .game b{font:900 13px/1.1 Rubik,sans-serif;font-style:italic;text-transform:uppercase;color:#fff}
  .game span{font:500 11px/1.3 Rubik,sans-serif;color:#CDBDF5}

  .trust{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:22px;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.12)}
  .trow{display:flex;align-items:center;gap:12px;font:500 14px/1.4 Rubik,sans-serif;color:#E9E0FF}
  .trow .ok{width:26px;height:26px;border-radius:50%;background:#FFC93C;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .legal{font:400 11px/1.45 Rubik,sans-serif;color:#8F80BF;text-align:center}

  .sticky{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:440px;z-index:5;padding:14px 20px calc(16px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(22,9,53,0),rgba(22,9,53,.92) 35%);transition:opacity .3s,transform .3s}
  .sticky.hide{opacity:0;transform:translate(-50%,30px);pointer-events:none}
</style>

<script>
(function () {
  // ===== НАСТРОЙКИ =====
  var REG_URL = 'https://click.bayloto.kg/XV9Csvqk?se_referrer=' + encodeURIComponent(document.referrer) + '&default_keyword=' + encodeURIComponent(document.title);   // трекинговая ссылка на регистрацию

  var TEXT = {
    ru: {
      chip: 'Бонус новичка',
      title: '300 сом на счёт за регистрацию',
      sub: 'Зарегистрируйся, пройди проверку через Түндүк — и играй на бонус в официальной лотерее Кыргызстана',

      howTitle: 'Как получить',

      gLemon: 'Мгновенная', gScratch: 'Скретч от 1 сом',
      t1: 'Официальная лотерея по договору с ГП «Кыргызлото»',
      t2: 'Игры сертифицированы международной лабораторией GLI',
      t3: 'Выигрыши на Mbank, О!Деньги, Optima, Bakai без комиссии',
      legal: '18+. Бонус начисляется после регистрации и верификации через Түндүк. Оператор ОсОО «ГЛП» по договору №19 с ГП «Кыргызлото».'
    },
    ky: {
      chip: 'Жаңы оюнчунун бонусу',
      title: 'Катталсаң эсебиңе 300 сом',
      sub: 'Катталып, Түндүк аркылуу текшерүүдөн өт — Кыргызстандын расмий лотереясында бонус менен ойно',

      gLemon: 'Ыкчам', gScratch: 'Скретч 1 сомдон',
      t1: '«Кыргызлото» МИ менен келишим боюнча расмий лотерея',

  };

  var params = new URLSearchParams(location.search);
  var lang = params.get('lang') === 'ky' ? 'ky' : 'ru';
  var qs = location.search.slice(1);
  var href = REG_URL + (qs ? (REG_URL.indexOf('?') >= 0 ? '&' : '?') + qs : '');

  function track(name) { try { if (window.fbq) fbq('trackCustom', name); } catch (e) {} }

  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = TEXT[lang][el.getAttribute('data-t')]; });

  document.querySelectorAll('.reg').forEach(function (a) {
    a.href = href;

  document.querySelectorAll('[data-lang]').forEach(function (p) {

  // липкая кнопка появляется, когда главная кнопка ушла с экрана

  applyLang();
